<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>

    <h2>Feedback Form</h2>

    <form>

        <!-- Full Name -->
        <label for="fullname">Full Name:</label><br>
        <input type="text"
               id="fullname"
               name="fullname"
               placeholder="Enter your full name"
               minlength="3"
               required>
        <br><br>

        <!-- Email -->
        <label for="email">Email Address:</label><br>
        <input type="email"
               id="email"
               name="email"
               placeholder="example@gmail.com"
               required>
        <br><br>

        <!-- Rating -->
        <h3>Rating</h3>

        <input type="radio" id="very-satisfied" name="rating">
        <label for="very-satisfied">Very Satisfied</label><br>

        <input type="radio" id="satisfied" name="rating">
        <label for="satisfied">Satisfied</label><br>

        <input type="radio" id="neutral" name="rating">
        <label for="neutral">Neutral</label><br>

        <input type="radio" id="unsatisfied" name="rating">
        <label for="unsatisfied">Unsatisfied</label><br><br>

        <!-- Interests -->
        <h3>Interests</h3>

        <input type="checkbox" id="web-dev" name="interest">
        <label for="web-dev">Web Development</label><br>

        <input type="checkbox" id="mobile-dev" name="interest">
        <label for="mobile-dev">Mobile Development</label><br>

        <input type="checkbox" id="ai-ml" name="interest">
        <label for="ai-ml">AI & Machine Learning</label><br><br>

        <!-- Country -->
        <label for="country">Select Country:</label><br>
        <select id="country" name="country" required>
            <option value="">--Choose Country--</option>
            <option value="nepal">Nepal</option>
            <option value="india">India</option>
            <option value="usa">USA</option>
        </select>
        <br><br>

        <!-- Feedback -->
        <label for="message">Write your feedback here:</label><br>
        <textarea id="message"
                  name="message"
                  rows="5"
                  cols="30"
                  maxlength="300"
                  placeholder="Write your feedback..."
                  required></textarea>
        <br><br>

        <!-- Submit -->
        <button type="submit">Submit</button>

    </form>

</body>
</html>
